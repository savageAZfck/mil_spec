[package]
name = "milc"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "CLI for the mil_spec toolchain: convert, lint, inspect, diff, compile, verify — the whole MIL pipeline in one binary."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "mil", "cli", "apple-silicon"]

[dependencies]
mil_spec = { path = "../..", version = "0.3.0" }
mil_passes = { path = "../mil_passes", version = "0.1.0" }
mil_lint = { path = "../mil_lint", version = "0.1.0" }
mil_compile = { path = "../mil_compile", version = "0.1.0" }
mil_verify = { path = "../mil_verify", version = "0.2.0" }
mil_infer = { path = "../mil_infer", version = "0.1.1" }
mil_machines = { path = "../mil_machines", version = "0.1.0" }
half = "2"
mil_convert = { path = "../mil_convert", version = "0.2.0" }

[[bin]]
name = "milc"
path = "src/main.rs"

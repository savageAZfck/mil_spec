[package]
name = "mil_onnx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "ONNX → MIL frontend and sklearn-style classical ML (tree ensembles, GLMs) → .mlpackage. Hand-rolled proto2 reader, no prost, no Python."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "mil", "onnx", "sklearn", "apple-silicon"]

[dependencies]
mil_spec = { path = "../..", version = "0.3.1" }
half = "2"
serde_json = "1"

[dev-dependencies]
mil_compile = { path = "../mil_compile" }
mil_infer = { path = "../mil_infer" }

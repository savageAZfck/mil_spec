[package]
name = "mil_convert"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "safetensors → MIL: config-driven transformer graph generation (Qwen-class) into .mlpackage. No Python, no coremltools."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "mil", "safetensors", "transformer", "llm"]

[dependencies]
mil_spec = { path = "../..", version = "0.3.1" }
mil_passes = { path = "../mil_passes", version = "0.1.0" }
mil_lint = { path = "../mil_lint" }
half = "2"
serde_json = "1"

[dev-dependencies]
mil_compile = { path = "../mil_compile" }
mil_infer = { path = "../mil_infer" }
mil_verify = { path = "../mil_verify" }

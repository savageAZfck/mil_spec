[package]
name = "mil_convert"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "safetensors and GGUF → MIL .mlpackage: every ggml quant type, lossless Q8_0/Q4_0 transcode, LoRA bake-in, quant planner, enumerated shapes, package surgery, provenance. No Python, no coremltools."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "mil", "safetensors", "transformer", "llm"]

[dependencies]
mil_spec = { path = "../..", version = "0.4.0" }
mil_passes = { path = "../mil_passes", version = "0.2.0" }
mil_lint = { path = "../mil_lint", version = "0.2.0" }
half = "2"
serde_json = "1"

[dev-dependencies]
mil_compile = { path = "../mil_compile" }
mil_infer = { path = "../mil_infer" }
mil_verify = { path = "../mil_verify" }

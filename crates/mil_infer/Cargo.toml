[package]
name = "mil_infer"
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
description = "Sovereign Apple Neural Engine compiler, decompiler, and runtime: native HWX Mach-O emitter + decompiler, MIL DAG graph scheduler, on-chip ANE backprop/SGD training, zero-copy IOSurface/Espresso execution."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "inference", "ane", "apple-silicon", "compiler"]

[dependencies]
mil_spec = { path = "../..", version = "0.4.2" }
mil_compile = { path = "../mil_compile", version = "0.2.0" }
half = "2"
serde_json = "1"

[dev-dependencies]
mil_compile = { path = "../mil_compile", version = "0.2.0" }
mil_verify = { path = "../mil_verify" }
mil_machines = { path = "../mil_machines", version = "0.2.0" }

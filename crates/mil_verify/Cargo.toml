[package]
name = "mil_verify"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Spec inspection, deterministic protobuf diff, and a conformance battery for MIL graphs — with planted controls."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "mil", "testing", "conformance"]

[dependencies]
mil_spec = { path = "../..", version = "0.3.0" }
mil_compile = { path = "../mil_compile", version = "0.1.0" }
mil_passes = { path = "../mil_passes", version = "0.1.0" }
mil_lint = { path = "../mil_lint", version = "0.1.0" }
mil_convert = { path = "../mil_convert", version = "0.2.0" }
half = "2"

[dev-dependencies]
mil_infer = { path = "../mil_infer" }

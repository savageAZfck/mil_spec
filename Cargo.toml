[workspace]
members = [
    ".",
    "crates/mil_convert",
    "crates/mil_onnx",
    "crates/mil_passes",
    "crates/mil_lint",
    "crates/mil_compile",
    "crates/mil_verify",
    "crates/mil_infer",
    "crates/mil_machines",
    "crates/milc",
]
resolver = "2"

[package]
name = "mil_spec"
version = "0.4.1"
edition = "2021"
rust-version = "1.80"
description = "Write Apple CoreML .mlpackage programs in pure Rust: MIL ops, stateful graphs, weight blobs. No Python, no coremltools."
license = "MIT OR Apache-2.0"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mil_spec"
homepage = "https://github.com/savageAZfck/mil_spec"
keywords = ["coreml", "neural-engine", "apple-silicon", "mil", "mlmodel"]
categories = ["compilers", "encoding", "parsing"]
readme = "README.md"

[dependencies]
half = "2"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
